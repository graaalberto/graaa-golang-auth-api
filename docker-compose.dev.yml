version: "3.8"

services:
  # Override auth-api for development with hot reload
  auth-api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: auth_api_dev
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - /app/tmp # Exclude air tmp directory
      - go_modules:/go/pkg/mod # Cache Go modules
    working_dir: /app
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_ADDR=redis:6379
      - REDIS_NOTIFY_KEYSPACE_EVENTS=Ex
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - shared-api-network

  fleet-api:
    build:
      context: .
      dockerfile: cmd/fleet-api/Dockerfile
    container_name: fleet_api_dev
    ports:
      - "8082:8081"
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=root
      - DB_NAME=auth_db
      - FLEET_API_PORT=8081
      - FLEET_API_JWT_SECRET=138B9bu6y5138B9bu6y5138B9bu6y513
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - shared-api-network

volumes:
  go_modules:

networks:
  shared-api-network:
    external: true
